name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - 'scripts/socket_guard.py'
              - 'docs/**'
            ui:
              - 'apps/ui/**'
              - 'pnpm-lock.yaml'

  rust:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy without the net feature
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test without the net feature
        run: cargo test --workspace
      - name: Clippy with the net feature
        run: cargo clippy -p curbcut-core --features net --all-targets -- -D warnings
      - name: Test with the net feature
        run: cargo test -p curbcut-core --features net

  property:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # A raised case budget makes a slow runner the limit; the tests stop at the
    # wall-clock budget rather than failing on it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: property
      - name: Core property and parser fuzz suite
        run: cargo test -p curbcut-core --test properties --test fuzz_parsers
        env:
          CURBCUT_PROP_CASES: "5000"
          CURBCUT_FUZZ_BUDGET_MS: "60000"
      - name: Merge, store, and adapt property suite
        run: cargo test -p curbcut-a11y -p curbcut-store -p curbcut-adapt --test properties
        env:
          CURBCUT_PROP_CASES: "5000"

  chaos:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: chaos
      - name: Failure injection suite
        run: cargo test -p curbcut-core --test chaos
        env:
          CURBCUT_PROP_CASES: "5000"

  socket-guard:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: socket-guard
      - name: Install strace
        run: sudo apt-get update -qq && sudo apt-get install -y strace
      - name: Prove the guard observes a connect
        run: python3 scripts/socket_guard.py --self-test
      - name: Build the probe without the net feature
        run: cargo build -p curbcut-core --example net_probe
      - name: Guard the offline probe
        run: python3 scripts/socket_guard.py ./target/debug/examples/net_probe
      - name: Build the probe with the net feature
        run: cargo build -p curbcut-core --features net --example net_probe
      - name: Guard the net-feature probe
        run: python3 scripts/socket_guard.py ./target/debug/examples/net_probe

  ui:
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/ui check
      - run: pnpm --dir apps/ui test

  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate and diff
        run: |
          python3 scripts/render_backlog.py
          git diff --exit-code -- backlog/

  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the workspace and diff
        run: |
          python3 scripts/scaffold_workspace.py
          git diff --exit-code
      - name: Check the role mapping doc
        run: python3 scripts/render_role_mapping.py --check

  incident-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test the incident-plan validator
        run: python3 scripts/validate_incident_plan.py --self-test
      - name: Check the plan keeps its guarantees
        run: python3 scripts/validate_incident_plan.py

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test the leak detector
        run: python3 scripts/check_no_content_logging.py --self-test
      - name: Scan the repository for content canaries
        run: python3 scripts/check_no_content_logging.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: panic-silence
      - name: Redaction tests
        run: cargo test -p curbcut-core --test no_content_logging
      - name: Build the panic-payload probe
        run: cargo build -p curbcut-core --example panic_payload_probe
      - name: Self-test the panic-silence detector
        run: python3 scripts/check_panic_silence.py --self-test
      - name: Assert the guarded panic printed nothing
        run: python3 scripts/check_panic_silence.py
      - name: Self-test the hash-statement validator
        run: python3 scripts/validate_hashes.py --self-test
      - name: Check the hash statement and its cross-references
        run: python3 scripts/validate_hashes.py

  privacy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test the inventory validator
        run: python3 scripts/validate_data_inventory.py --self-test
      - name: Validate the data inventory, DPIA, and findings register
        run: python3 scripts/validate_data_inventory.py
      - name: Self-test the telemetry-retention validator
        run: python3 scripts/validate_telemetry_retention.py --self-test
      - name: Check the telemetry retention claim
        run: python3 scripts/validate_telemetry_retention.py
      - name: Self-test the retention validator
        run: python3 scripts/validate_retention.py --self-test
      - name: Check the retention decisions and their consumers
        run: python3 scripts/validate_retention.py
      - name: Self-test the voice-path validator
        run: python3 scripts/validate_voice_pipeline.py --self-test
      - name: Check the voice path and its cross-references
        run: python3 scripts/validate_voice_pipeline.py
      - name: Self-test the transmission-path validator
        run: python3 scripts/validate_transmission_paths.py --self-test
      - name: Check the transmission paths and their cross-references
        run: python3 scripts/validate_transmission_paths.py
      - name: Self-test the network-policy validator
        run: python3 scripts/validate_network_policy.py --self-test
      - name: Check the update-check exception and its controls
        run: python3 scripts/validate_network_policy.py

  study-instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test the study scoring instrument
        run: python3 scripts/study_instrument.py --self-test
      - name: Self-test the study protocol validator
        run: python3 scripts/validate_study_protocol.py --self-test
      - name: Validate the study protocol and consent text
        run: python3 scripts/validate_study_protocol.py

  a11y-mapping:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test the accessibility doc generator
        run: python3 scripts/render_a11y_mapping.py --self-test
      - name: Check the generated accessibility documents
        run: python3 scripts/render_a11y_mapping.py --check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: a11y-mapping
      - name: Resolve every row's test link
        run: cargo test -p curbcut-cli --test a11y_mapping

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test SBOM generation
        run: python3 scripts/sbom.py --self-test
      - name: Generate the SBOM and attestation placeholder
        run: >-
          python3 scripts/sbom.py generate --output build/sbom.json
          --attestation build/attestation.json --strict
      - name: Check the published SBOM against the manifests
        run: python3 scripts/sbom.py check --sbom build/sbom.json --strict
      - name: Self-test the supply-chain validator
        run: python3 scripts/validate_supply_chain.py --self-test
      - name: Validate release prerequisites
        run: >-
          python3 scripts/validate_supply_chain.py --sbom build/sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/
          if-no-files-found: error

  golden:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: golden
      - name: Golden plan snapshots
        run: cargo test -p curbcut-core --test golden_plans

  differential:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: differential
      - name: Differential reading-order and role baseline
        run: cargo test -p curbcut-a11y --test differential -- --nocapture

  model-guard:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: model-guard
      - name: Hash test vectors
        run: cargo test -p curbcut-core --lib hash
      - name: Model pin and signature guard
        run: cargo test -p curbcut-vision --test model_guard -- --nocapture

  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test the dataset validator
        run: python3 scripts/validate_dataset.py --self-test
      - name: Validate the published dataset
        run: python3 scripts/validate_dataset.py
      - name: Self-test the benchmark harness
        run: python3 scripts/reproduce_benchmark.py --self-test
      - name: Reproduce the benchmark
        run: python3 scripts/reproduce_benchmark.py
